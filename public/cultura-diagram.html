*{margin:0;padding:0;box-sizing:border-box;}
body{background:#060812;display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;overflow:hidden;}
#wrap{position:relative;}
svg{display:block;}

.inode{cursor:pointer;}
.inode .nb{transition:fill .16s;}
.inode:hover .nb{fill:rgba(61,108,255,.1);}
.inode:hover .nk{stroke:rgba(61,108,255,.5)!important;}
.inode.lit .nb{fill:rgba(61,108,255,.13);}
.inode.lit .nk{stroke:#3D6CFF!important;}

.panel{
  position:fixed;top:0;right:0;width:400px;height:100vh;
  background:#0C1024;border-left:1px solid rgba(255,255,255,.1);
  transform:translateX(100%);transition:transform .36s cubic-bezier(.22,.61,.36,1);
  z-index:200;display:flex;flex-direction:column;
}
.panel.open{transform:translateX(0);}
.ph{padding:30px 28px 22px;border-bottom:1px solid rgba(255,255,255,.07);position:relative;}
.pid{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.28);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.ptitle{font-family:'Newsreader',serif;font-size:24px;font-weight:600;color:#fff;letter-spacing:-.02em;line-height:1.1;}
.pclose{position:absolute;top:26px;right:22px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.35);font-size:16px;border:1px solid rgba(255,255,255,.12);font-family:'Inter Tight',sans-serif;transition:all .15s;}
.pclose:hover{color:#fff;border-color:rgba(255,255,255,.35);}
.pb{flex:1;padding:26px;overflow-y:auto;}
.pdesc{font-family:'Newsreader',serif;font-style:italic;font-size:14px;color:rgba(255,255,255,.5);line-height:1.65;margin-bottom:24px;}
.psec{font-family:'Inter Tight',sans-serif;font-size:9px;font-weight:500;color:rgba(255,255,255,.25);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.pitems{list-style:none;margin-bottom:24px;}
.pitems li{font-family:'Inter Tight',sans-serif;font-size:13px;color:rgba(255,255,255,.65);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);display:flex;gap:10px;line-height:1.45;}
.pitems li::before{content:'—';color:#C4267A;flex-shrink:0;}
.psrc{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.25);letter-spacing:.05em;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);}

@keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes rpulse{0%,100%{opacity:.08}50%{opacity:.22}}
</style>

function openPanel(id){
  var d=DATA[id]; if(!d)return;
  document.getElementById('p-id').textContent=d.id;
  document.getElementById('p-title').textContent=d.title;
  document.getElementById('p-desc').textContent=d.desc;
  document.getElementById('p-items').innerHTML=d.items.map(function(t){return'<li>'+t+'</li>';}).join('');
  document.getElementById('p-src').textContent=d.src;
  document.getElementById('panel').classList.add('open');
  document.querySelectorAll('.inode').forEach(function(n){n.classList.remove('lit');});
  var n=document.getElementById('in-0'+id); if(n)n.classList.add('lit');
}
function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.inode').forEach(function(n){n.classList.remove('lit');});
}
